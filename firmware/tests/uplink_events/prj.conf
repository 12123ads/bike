# uplink_events 测试的配置。
#
# 与 firmware/nrf52840/prj.conf **不共用**：这里只开 uplink.c 编译和运行
# 所需的最小集。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# uplink.c 的依赖
CONFIG_REBOOT=y
# reset_cause_str() 用 hwinfo_get_reset_cause()
CONFIG_HWINFO=y

# proto.c 用 %.6f 拼坐标
CONFIG_CBPRINTF_FP_SUPPORT=y
# proto.c 用 base64_decode()（契约 §6.2 的 dn/secret）
CONFIG_BASE64=y

# 测试要另起一个线程去抢 ev_lock
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=8192
