# modem_reconnect 测试的配置。
#
# 与 firmware/nrf52840/prj.conf 的关系：**不共用**。这里只开 modem.c 编译和
# 运行所需的最小集；uart-emul 上挂假模组，不需要 BLE / 密码学 / flash。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# modem.c 的依赖
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
# uart-emul 需要 EMUL 子系统（drivers/serial/Kconfig.emul 的 depends on）
CONFIG_EMUL=y

# proto.c 用 %.6f 拼坐标；modem.c 用 sscanf 解时间。
# picolibc 的 sscanf 不需要单独开关，但浮点 printf 要。
CONFIG_CBPRINTF_FP_SUPPORT=y

# proto.c 用 base64_decode()（契约 §6.2 的 dn/secret）
CONFIG_BASE64=y

# 主线程栈：sscanf + 日志都吃栈
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
