# unlock_slots 测试的配置。
#
# 与 firmware/nrf52840/prj.conf **不共用**：这里只开 unlock.c + crypto.c
# 需要的最小集。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# crypto.c 走 PSA。native_sim 上没有 CryptoCell，落到 Oberon 软件驱动 ——
# 和 ble_unlock_bsim 那份逐行同理由（HMAC-SHA256 + TRNG 就是 §5.2 的全部需求）。
# ⚠ 不写 CONFIG_NRF_SECURITY：它是 promptless 的（由 PSA_CRYPTO select），
#    显式赋值会让 kconfig 报错。
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# PSA 初始化 + HMAC 都吃栈
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=8192
