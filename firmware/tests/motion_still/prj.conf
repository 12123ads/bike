# motion_still 测试的配置。
#
# 与 firmware/nrf52840/prj.conf 的关系：**不共用**，但两处必须一致的是
# `CONFIG_LIS2DW12_SLEEP` —— 真固件里它是**关的**（STATIONARY 走 INT2，
# 本板没接线），这里也必须关，否则测的就不是真固件的那份行为。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# --- 传感器 -------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_OWN_THREAD=y
CONFIG_LIS2DW12_THREAD_STACK_SIZE=1024
CONFIG_LIS2DW12_WAKEUP=y
# ⚠ 与真固件一致：不开。见文件头。
# CONFIG_LIS2DW12_SLEEP is not set

CONFIG_I2C=y
CONFIG_GPIO=y

# --- 仿真后端 -----------------------------------------------------------------
# i2c_emul 挂假芯片，gpio_emul 注入 INT1 边沿。
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_GPIO_EMUL=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
# 静止超时跑在系统工作队列上，栈要够回调里的 snprintf
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
