# modem_downlink 测试的配置。
#
# 与 firmware/nrf52840/prj.conf 的关系：**不共用**。这里只开 modem.c 编译和
# 运行所需的最小集（和 modem_time 那份一样，逐行同理由）。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# modem.c 的依赖
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
# uart-emul 需要 EMUL 子系统（drivers/serial/Kconfig.emul 的 depends on）
CONFIG_EMUL=y

# proto.c 用 %.6f 拼坐标；modem.c 用 sscanf 解时间。
CONFIG_CBPRINTF_FP_SUPPORT=y

# proto.c 用 base64_decode()（契约 §6.2 的 dn/secret）
CONFIG_BASE64=y

# 主线程栈：sscanf + 日志都吃栈
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=8192

# ⚠ uart-emul 的 RX FIFO 必须装得下一整条超长行（LINE_MAX=640 加余量），
# 否则「喂一条 900 字节的行」会在 emul 层就被截断 —— 那样测的是
# uart-emul 的 FIFO 而不是 read_line 的溢出处理。overlay 里配了 2048。
