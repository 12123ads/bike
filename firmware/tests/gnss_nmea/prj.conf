# gnss_nmea 测试的配置。
#
# 与 firmware/nrf52840/prj.conf **不共用**：这里只开 gnss.c 编译和运行
# 所需的最小集（和 modem_downlink 那份同理由）。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# gnss.c 的依赖
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_GPIO=y
# uart-emul 需要 EMUL 子系统（drivers/serial/Kconfig.emul 的 depends on）
CONFIG_EMUL=y

# ⚠ gnss.c 用的是 uart0，而 native_sim 把 uart0 当 console。
# overlay 把 uart0 换成 uart-emul 之后 console 必须改道，
# 否则 ztest 的输出和喂进去的 NMEA 会混在同一个 emul 上。
CONFIG_UART_CONSOLE=n
CONFIG_POSIX_ARCH_CONSOLE=y

# gnss.c 用 strtod 解坐标，日志用 %.6f 打出来
CONFIG_CBPRINTF_FP_SUPPORT=y

# strtod + 日志都吃栈
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=8192
