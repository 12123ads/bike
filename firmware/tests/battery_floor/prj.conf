# battery_floor 测试的配置。
#
# 与 firmware/nrf52840/prj.conf 的关系：**不共用**。这里只补齐让 battery.c
# 能编能跑的最小集：ADC + GPIO，后端换成 emul。

CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

CONFIG_ADC=y
CONFIG_GPIO=y

# ⚠ 与真固件一致：必须关掉。overlay 里 `vbatt` 的 compatible 是
# "voltage-divider"，那个驱动是 `default y`，会成为 `power-gpios`
# （= batt_gate）的第二个占有者并把门控**打开留着**（真 prj.conf 有完整说明）。
# 本测试有一条用例专门断言「采完门控必须是关的」，开着它会直接红。
CONFIG_VOLTAGE_DIVIDER=n

# --- 仿真后端 -----------------------------------------------------------------
CONFIG_EMUL=y
CONFIG_ADC_EMUL=y
CONFIG_GPIO_EMUL=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
