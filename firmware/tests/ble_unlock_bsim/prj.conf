# BabbleSim 测试的配置。
#
# 与 firmware/nrf52840/prj.conf 的关系：**不共用**。这里只开开锁通道要的东西，
# 但**凡是影响被测行为的项必须一致**，尤其是那两个 MTU 数字 ——
# 测试里的断言 1 会在运行时验证「MTU−3 ≥ 30」，改小了会当场失败。

CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_EBIKE_LOG_LEVEL=4

# --- BLE -----------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# central 角色只有测试需要（假装手机）。真固件里是 n —— 见 prj.conf。
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="ebike"
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n

# 必须和 firmware/nrf52840/prj.conf 一致（DESIGN.md §2.3 的算式）。
CONFIG_BT_L2CAP_TX_MTU=40
CONFIG_BT_BUF_ACL_RX_SIZE=44

# --- 密码学 --------------------------------------------------------------------
# bsim 上没有 CryptoCell 硬件，PSA 落到 Oberon 软件驱动。
# 被测的是 unlock.c 的协议逻辑，不是 CC310 的硬件路径。
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# --- 持久化 --------------------------------------------------------------------
# nvstore.c 要 settings；bsim 的 flash 是模拟的（zephyr,sim-flash）。
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
