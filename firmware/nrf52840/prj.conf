# nRF52840 ProMicro 克隆板 —— 电瓶车定位 + 手机 NFC 开锁
#
# 符号名的三处更正来自 DESIGN.md §2.2，原稿写错过：
#   CONFIG_NFC_T4T_NRFXLIB      （不是 CONFIG_NFC_T4T_LIB，那个不存在）
#   CONFIG_PSA_WANT_KEY_TYPE_HMAC（不是 KEY_TYPE_AES）
# DTS 里的 irq-gpios（不是 int1-gpios）见 overlay。

# --- 板级 / 构建 ---------------------------------------------------------------
# 板子自带 Adafruit bootloader，**不要用 MCUboot**（DESIGN.md §3.4：会打架）
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# --- NFC 标签（raw ISO-DEP） ---------------------------------------------------
# nRF52840 的 NFCT 只能当标签，手机当读卡器 —— DESIGN.md §2.1 的硬约束
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_NFC_PLATFORM=y
CONFIG_NFC_THREAD_CALLBACK=y

# --- 密码学（CryptoCell-310 硬件 HMAC） ----------------------------------------
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y

# --- 持久化（密钥、counter、序号 q） -------------------------------------------
# counter 掉电必须不回零，否则 §5.2 的重放防护失效
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- 传感器 -------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_OWN_THREAD=y
CONFIG_LIS2DW12_THREAD_STACK_SIZE=1024
# STATIONARY 事件依赖这个；打开后要确认驱动写的是 INT1 还是 INT2
# （DESIGN.md §3.7 的未解决矛盾，R2 阶段读源码定论）
CONFIG_LIS2DW12_SLEEP=y

CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# --- 串口（GNSS + Air780EP） ---------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=n
CONFIG_RING_BUFFER=y

# --- 低功耗 -------------------------------------------------------------------
# System OFF 0.40 µA / System ON+RTC 3.16 µA（DESIGN.md §4.2）
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
# GPIOTE 必须用 PORT 事件：IN 事件是 17.37 µA，PORT 是 2.36 µA（§4.2 的陷阱）
CONFIG_GPIO_NRFX_INTERRUPT_DETECT_MODE_PORT=y

# --- 日志 ---------------------------------------------------------------------
# 生产上要关：RTT/UART 日志本身耗电，而且没人看
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- 其它 ---------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_EVENTS=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_JSON_LIBRARY=n
CONFIG_CBPRINTF_FP_SUPPORT=y
