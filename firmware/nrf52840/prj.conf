# nRF52840 ProMicro 克隆板 —— 电瓶车定位 + 手机 BLE 开锁
#
# 符号名的两处更正来自 DESIGN.md §2.2，原稿写错过：
#   CONFIG_PSA_WANT_KEY_TYPE_HMAC（不是 KEY_TYPE_AES）
# DTS 里的 irq-gpios（不是 int1-gpios）见 overlay。

# --- 板级 / 构建 ---------------------------------------------------------------
# 板子自带 Adafruit bootloader，**不要用 MCUboot**（DESIGN.md §3.4：会打架）
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# --- BLE（GATT peripheral，开锁通道） -----------------------------------------
# 手机当 central 写 APDU，车回 notify —— DESIGN.md §2.1。
# 只做 peripheral：本设备从不主动扫描或发起连接。
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="ebike"

# **不开 SMP、不开 BT_SETTINGS**，这是有意的（DESIGN.md §5.5 / ADR-004 §5）：
# 设备没有屏幕也没有键盘，IO capability 只能是 NoInputNoOutput，
# 那种配置下 LESC 只能走 Just Works —— 没有 MITM 防护（host/smp.c 的
# remote_sec_level_reachable() 对 JUST_WORKS 直接返回 AUTH_REQUIREMENTS，
# L3/L4 达不到）。认证由 §5.2 的 HMAC 挑战应答负责，不依赖链路加密。
# 不开 SMP ⇒ 没有 LTK/IRK 要持久化 ⇒ 不该让 BT 去写 counter 住的那 32 kB
# storage 分区（BT_SETTINGS 还会让 settings_load 多一处时序要求）。
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n

# MTU 必须调大，默认值差得不止一点：
#   ATT_MTU 默认 23（host/att_internal.h 的 BT_ATT_DEFAULT_LE_MTU），
#   写请求可写载荷 = ATT_MTU − 3（1 B opcode + 2 B handle）= 20 字节，
#   而最长一条 C-APDU 是 UNLOCK：5 + [uid(4)+counter(4)+mac(16)] + 1 = 30 字节。
# 本地上限由两者取小决定（att_internal.h：MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU)，
# 其中 BT_L2CAP_RX_MTU = CONFIG_BT_BUF_ACL_RX_SIZE − 4），所以两个都要给：
#   40 − 3 = 37 ≥ 30 ✓        44 − 4 = 40 ≥ 40 ✓
# ⚠ 副作用：ACL_RX_SIZE > 27 会让 BT_DATA_LEN_UPDATE 变成 default y，
#   进而 BT_CTLR_DATA_LENGTH=y，SDC 的 per-link 缓冲跟着涨。这是划算的 ——
#   换掉的是应用层分包逻辑，而分包会让「nonce 一次性」的安全论证被半条报文复杂化。
# ⚠ 手机侧仍要主动 requestMtu()：MTU 交换由 central 发起，我们是 server，
#   CONFIG_BT_GATT_AUTO_UPDATE_MTU 只对 GATT client 有效。
CONFIG_BT_L2CAP_TX_MTU=40
CONFIG_BT_BUF_ACL_RX_SIZE=44

# --- 密码学（CryptoCell-310 硬件 HMAC） ----------------------------------------
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y

# --- 持久化（密钥、counter、序号 q） -------------------------------------------
# counter 掉电必须不回零，否则 §5.2 的重放防护失效
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- 传感器 -------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_OWN_THREAD=y
CONFIG_LIS2DW12_THREAD_STACK_SIZE=1024

# `CONFIG_LIS2DW12_WAKEUP` 必须开，它 gate 了两样东西：
#   1. `SENSOR_TRIG_MOTION`（驱动的 `case SENSOR_TRIG_MOTION` 整段裹在
#      `#ifdef CONFIG_LIS2DW12_WAKEUP` 里，不开的话 sensor_trigger_set
#      返回 -ENOTSUP，motion_init 直接失败 —— **唤醒源根本不存在**）；
#   2. `SENSOR_ATTR_UPPER_THRESH`（lis2dw12.c:322 的
#      `#if (CONFIG_LIS2DW12_SLEEP || CONFIG_LIS2DW12_WAKEUP)`）—— 是 `||`，
#      所以单开 WAKEUP 就够，阈值照样能设。
CONFIG_LIS2DW12_WAKEUP=y

# ⚠ **`CONFIG_LIS2DW12_SLEEP` 刻意不开**（原来是 `=y`）。
# 它只 gate `SENSOR_TRIG_STATIONARY`，而那个触发走 **INT2**，本板只接了 INT1
# —— 注册它会返回 0 但事件永不到达（src/motion.h 的长注释）。
# 静止判定已改成 motion.c 里的软件计时（`CONFIG_EBIKE_STILL_AFTER_S`），
# 代码里不再注册 STATIONARY，所以这个符号是纯负担：
# 多编一段 ISR 分支、多一个 handler 指针、还让读配置的人以为硬件静止检测可用。

CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# ⚠ **必须显式关掉。** overlay 里 `vbatt` 节点的 compatible 是 "voltage-divider"，
# 而 `drivers/sensor/voltage_divider/Kconfig` 是 `default y` +
# `depends on DT_HAS_VOLTAGE_DIVIDER_ENABLED` —— 只要节点存在它就会被编进来。
#
# 那个驱动会成为 `power-gpios`（= batt_gate）的**第二个占有者**，而且默认状态相反：
# `voltage_init()` 结尾的 `pm_device_driver_init()` 在 PM_DEVICE=y /
# PM_DEVICE_RUNTIME=n 下会依次跑 TURN_ON → **RESUME**，RESUME 里
# `gpio_pin_set_dt(&config->gpio_power, 1)` 把门控**打开并一直留着**。
# 现在只是因为 `battery_init()` 在 application 阶段跑得更晚、又把它拉回低
# 才没事 —— 依赖初始化顺序的巧合，不是设计。
#
# battery.c 用到的两样东西都不需要这个驱动：
#   VOLTAGE_DIVIDER_DT_SPEC_GET  —— 纯 DT 宏
#   voltage_divider_scale_dt()   —— 头文件里的 static inline
# 所以关掉它没有任何损失，只去掉一个会偷偷开门控的所有者。
CONFIG_VOLTAGE_DIVIDER=n

# --- 串口（GNSS + Air780EP） ---------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=n
CONFIG_RING_BUFFER=y

# --- 低功耗 -------------------------------------------------------------------
# System OFF 0.40 µA / System ON+RTC 3.16 µA（DESIGN.md §4.2）
#
# ⚠ **不要加 CONFIG_PM=y。** `subsys/pm/Kconfig` 的 `config PM` 要求
# `depends on SYS_CLOCK_EXISTS && HAS_PM`，而 `soc/nordic/nrf52/Kconfig` 只
# `select HAS_POWEROFF`，**没有 HAS_PM**（整棵树里 select HAS_PM 的只有
# nrf54h / nrf92）。写了会是未满足依赖的 Kconfig warning，而 Zephyr 的
# `scripts/kconfig/kconfig.py` 把这类 warning 升级成 error。
# 上游的 `samples/boards/nordic/system_off` 也只开 PM_DEVICE + POWEROFF。
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# --- 日志：走 RTT，不走 UART/USB ------------------------------------------------
# 板级默认（`boards/common/usb/Kconfig.cdc_acm_serial.defconfig`）会把 console
# 挂到 **USB CDC ACM**（`cdc_acm_serial.dtsi` 里 `zephyr,console = &board_cdc_acm_uart`），
# 并且 `CDC_ACM_SERIAL_INITIALIZE_AT_BOOT` 默认 y —— 那意味着开机就起 USB 栈。
# 电池产品不能这样：USB 外设常开是毫安级，而且本设计的 USB 口根本不引出（§5.9）。
#
# 所以关掉板级 CDC ACM 后端，改用 RTT：RTT 在没接调试器时不产生额外功耗，
# 而 J-Link 仍然是这块克隆板的调试主路（板载 bootloader 只给 UF2 烧写，
# 单步和实时日志都要 SWD）。
# 顺带解掉一个隐患：console 若落到 uart0，会和 GNSS 抢同一个外设。
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- 其它 ---------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_REBOOT=y
# 复位原因 → 契约 §5.1 的 rst 五值闭集（uplink.c 的 reset_cause_str）。
# ⚠ `CONFIG_HWINFO` 这一行**必须有**：`drivers/hwinfo/Kconfig.nrf` 是
# rsource 在 `if HWINFO` 里的，所以 `HWINFO_NRF` 的那个 `default y`
# 只有在 HWINFO 打开之后才生效。少这一行是链接期
# `undefined reference to z_impl_hwinfo_get_reset_cause`（实测过）。
CONFIG_HWINFO=y
CONFIG_JSON_LIBRARY=n
# proto.c 用 base64_decode() 解 dn/secret 的 32 字节密钥（契约 §6.2）。
# 这个符号默认 n，不开就是链接期 `undefined reference to base64_decode`（实测过）。
CONFIG_BASE64=y
# proto.c 用 %.6f / %.1f 拼报文，没有它坐标会变成乱码
CONFIG_CBPRINTF_FP_SUPPORT=y
