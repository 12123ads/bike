# nRF52840 ProMicro 克隆板 —— 电瓶车定位 + 手机 NFC 开锁
#
# 符号名的三处更正来自 DESIGN.md §2.2，原稿写错过：
#   CONFIG_NFC_T4T_NRFXLIB      （不是 CONFIG_NFC_T4T_LIB，那个不存在）
#   CONFIG_PSA_WANT_KEY_TYPE_HMAC（不是 KEY_TYPE_AES）
# DTS 里的 irq-gpios（不是 int1-gpios）见 overlay。

# --- 板级 / 构建 ---------------------------------------------------------------
# 板子自带 Adafruit bootloader，**不要用 MCUboot**（DESIGN.md §3.4：会打架）
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# --- NFC 标签（raw ISO-DEP） ---------------------------------------------------
# nRF52840 的 NFCT 只能当标签，手机当读卡器 —— DESIGN.md §2.1 的硬约束
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_NFC_PLATFORM=y
CONFIG_NFC_THREAD_CALLBACK=y

# --- 密码学（CryptoCell-310 硬件 HMAC） ----------------------------------------
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y

# --- 持久化（密钥、counter、序号 q） -------------------------------------------
# counter 掉电必须不回零，否则 §5.2 的重放防护失效
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# --- 传感器 -------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_OWN_THREAD=y
CONFIG_LIS2DW12_THREAD_STACK_SIZE=1024
# STATIONARY 事件依赖这个；打开后要确认驱动写的是 INT1 还是 INT2
# （DESIGN.md §3.7 的未解决矛盾，R2 阶段读源码定论）
CONFIG_LIS2DW12_SLEEP=y

CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# --- 串口（GNSS + Air780EP） ---------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=n
CONFIG_RING_BUFFER=y

# --- 低功耗 -------------------------------------------------------------------
# System OFF 0.40 µA / System ON+RTC 3.16 µA（DESIGN.md §4.2）
#
# ⚠ **不要加 CONFIG_PM=y。** `subsys/pm/Kconfig` 的 `config PM` 要求
# `depends on SYS_CLOCK_EXISTS && HAS_PM`，而 `soc/nordic/nrf52/Kconfig` 只
# `select HAS_POWEROFF`，**没有 HAS_PM**（整棵树里 select HAS_PM 的只有
# nrf54h / nrf92）。写了会是未满足依赖的 Kconfig warning，而 Zephyr 的
# `scripts/kconfig/kconfig.py` 把这类 warning 升级成 error。
# 上游的 `samples/boards/nordic/system_off` 也只开 PM_DEVICE + POWEROFF。
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# --- 日志：走 RTT，不走 UART/USB ------------------------------------------------
# 板级默认（`boards/common/usb/Kconfig.cdc_acm_serial.defconfig`）会把 console
# 挂到 **USB CDC ACM**（`cdc_acm_serial.dtsi` 里 `zephyr,console = &board_cdc_acm_uart`），
# 并且 `CDC_ACM_SERIAL_INITIALIZE_AT_BOOT` 默认 y —— 那意味着开机就起 USB 栈。
# 电池产品不能这样：USB 外设常开是毫安级，而且本设计的 USB 口根本不引出（§5.9）。
#
# 所以关掉板级 CDC ACM 后端，改用 RTT：J-Link 本来就是必备工具（要解 UICR 的
# NFC 引脚锁），而 RTT 在没接调试器时不产生额外功耗。
# 顺带解掉一个隐患：console 若落到 uart0，会和 GNSS 抢同一个外设。
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- 其它 ---------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_REBOOT=y
# 复位原因 → 契约 §5.1 的 rst 五值闭集（uplink.c 的 reset_cause_str）。
# CONFIG_HWINFO_NRF 是 default y 且依赖已满足，不用显式写。
CONFIG_HWINFO=y
CONFIG_JSON_LIBRARY=n
# proto.c 用 %.6f / %.1f 拼报文，没有它坐标会变成乱码
CONFIG_CBPRINTF_FP_SUPPORT=y
